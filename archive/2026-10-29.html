let curArtIdx = 0;
let curSubTab = 0;
const savedState = {};

function toBase64Url(obj) {
  const jsonStr = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(jsonStr);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function triggerSave(payload, statusSpanId) {
  const el = document.getElementById(statusSpanId);
  if (el) el.innerHTML = `<span style="color:#1e40af;font-weight:700;font-size:0.78rem;">⏳ 正在寫入 ${payload.target === 'both' ? 'Zotero ＆ Notion' : payload.target.toUpperCase()}...</span>`;
  try {
    const resp = await fetch("http://127.0.0.1:8765/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const res = await resp.json();
    if (res && res.ok) {
      savedState[payload.code] = res;
      const zBadge = res.zotero_key ? `<span class="badge b-ok">✅ Zotero: ${res.zotero_key}</span> ` : "";
      const nLink = res.notion_url ? `<a class="ext-link" href="${res.notion_url}" target="_blank" rel="noopener">📝 開啟 Notion 筆記</a>` : "";
      if (el) el.innerHTML = zBadge + nLink;
      return;
    }
  } catch (e) {
    const b64 = toBase64Url(payload);
    window.open(`http://127.0.0.1:8765/api/save?d=${b64}`, "_blank");
    if (el) el.innerHTML = `<span class="badge b-ok">✅ 已在新分頁觸發入庫橋接（預設不自動覆寫未選項目）</span>`;
  }
}

function buildSaveButtonsHtml(itemObj, isMain) {
  const code = itemObj.code;
  const statusId = `status-${code}`;
  const existing = savedState[code];
  const initStatus = existing
    ? `${existing.zotero_key ? `<span class="badge b-ok">✅ Zotero: ${existing.zotero_key}</span> ` : ""}${existing.notion_url ? `<a class="ext-link" href="${existing.notion_url}" target="_blank" rel="noopener">📝 開啟 Notion</a>` : ""}`
    : `<span style="font-size:0.75rem;color:#64748b;">（未點擊則預設不存入）</span>`;

  const makePayload = (target) => ({
    target,
    code: itemObj.code,
    titleZh: itemObj.titleZh,
    titleOrig: itemObj.titleOrig,
    authors: itemObj.authors,
    journal: itemObj.journal || itemObj.publisher,
    publisher: itemObj.publisher || itemObj.journal,
    pubDate: itemObj.pubDate || "2026-10-29",
    year: itemObj.year || 2026,
    doi: itemObj.doi || itemObj.url,
    url: itemObj.url || itemObj.doi,
    tags: itemObj.tags || ["fundraising", "donation"],
    summaryShort: isMain ? itemObj.bullets.map(b => b.text).join(" ") : itemObj.point,
    summaryPoints: isMain ? itemObj.bullets.map(b => b.text) : [itemObj.point],
    criticalPoints: isMain ? itemObj.critiques : [itemObj.value],
    consultantInsight: isMain ? itemObj.consultant : itemObj.deep,
    teachingQuestion: isMain ? itemObj.teachingQ : `請結合《${itemObj.titleOrig}》探討其對台灣與亞洲 NPO 策略募款之實務啟示。`
  });

  const pBoth = JSON.stringify(makePayload("both")).replace(/"/g, "&quot;");
  const pZot = JSON.stringify(makePayload("zotero")).replace(/"/g, "&quot;");
  const pNot = JSON.stringify(makePayload("notion")).replace(/"/g, "&quot;");

  return `
    <button class="save-btn primary" onclick="triggerSave(${pBoth}, '${statusId}')">📥 同時存入 Zotero ＆ Notion</button>
    <button class="save-btn" onclick="triggerSave(${pZot}, '${statusId}')">📚 僅存入 Zotero</button>
    <button class="save-btn" onclick="triggerSave(${pNot}, '${statusId}')">📝 僅存入 Notion</button>
    <span id="${statusId}">${initStatus}</span>
  `;
}

function renderAll() {
  document.getElementById("art-nav").innerHTML = ARTICLES.map((it, i) => `
    <button class="art-pill ${i === curArtIdx ? 'active' : ''}" onclick="curArtIdx=${i};curSubTab=0;renderAll();">
      第 ${i + 1} 則：${it.region.split(' ')[0]} ${it.titleZh.slice(0, 15)}…
    </button>
  `).join("");

  const art = ARTICLES[curArtIdx];
  let bodyHtml = "";
  if (curSubTab === 0) {
    bodyHtml = art.bullets.map(b => `
      <div class="bullet-box">
        <div>${b.text} <a class="ext-link" href="${art.url}" target="_blank" rel="noopener">[原始文本連結]</a></div>
        <div class="quote-box">📜 <strong>原文引句 (Verbatim Quote)：</strong>${b.quote}</div>
      </div>
    `).join("");
  } else if (curSubTab === 1) {
    bodyHtml = art.critiques.map(c => `<div class="bullet-box" style="border-left-color:#d97706;">⚖️ ${c}</div>`).join("");
  } else if (curSubTab === 2) {
    bodyHtml = `
      <div class="bullet-box" style="border-left-color:#059669;"><strong>💼 顧問實務洞察：</strong><br/>${art.consultant}</div>
      <div class="bullet-box" style="border-left-color:#7c3aed;"><strong>🎓 課堂備課提問：</strong><br/>${art.teachingQ}</div>
    `;
  } else {
    bodyHtml = art.refs.map((r, rIdx) => {
      const rWithTags = Object.assign({ tags: art.tags, pubDate: art.pubDate, year: r.year }, r);
      const dId = `dd-${art.code}-${rIdx}`;
      return `
        <div class="ref-card">
          <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
            <span class="badge" style="background:var(--purple-bg);color:var(--purple-text);">延伸參考文獻 ${r.code}</span>
            <a class="ext-link" href="${r.doi}" target="_blank" rel="noopener">🔗 Crossref / 原文連結: ${r.doi}</a>
          </div>
          <div class="ref-title-zh">${r.titleZh}</div>
          <div class="ref-title-orig">📖 原文文獻名稱：${r.titleOrig}</div>
          <div style="font-size:0.79rem;color:var(--muted);margin-bottom:6px;">👤 <strong>作者：</strong>${r.authors} ｜ 🏛️ <strong>出處：</strong><em>${r.journal}</em> (${r.year})</div>
          <div style="font-size:0.85rem;background:#f8fafc;padding:8px 12px;border-radius:6px;margin-bottom:6px;border-left:3px solid #64748b;"><strong>📌 核心論點：</strong>${r.point}</div>
          <div style="font-size:0.83rem;background:var(--amber-bg);color:var(--amber-text);padding:8px 12px;border-radius:6px;margin-bottom:10px;"><strong>💡 對照價值：</strong>${r.value}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
            ${buildSaveButtonsHtml(rWithTags, false)}
            <button class="deep-btn" onclick="document.getElementById('${dId}').classList.toggle('show')">🔍 深入閱讀與討論此文獻</button>
          </div>
          <div class="deep-drawer" id="${dId}">
            <strong>🔬 深度方法論與台日實務研討：</strong><br/>${r.deep}<br/>
            <span style="color:#3730a3;font-weight:700;">💬 研討提問：</span>如何將《${r.titleOrig}》之研究發現與主文獻《${art.titleOrig}》結合應用於台灣與日本之非營利募款與治理實務？
          </div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("art-card").innerHTML = `
    <div class="meta-bar">
      <span class="badge b-region">${art.region}</span>
      <span class="badge b-ok">✅ 原文核驗通過</span>
      <span>🕒 發布時間：<strong>${art.timestamp}</strong></span>
      <span>🏛️ 出處：<strong>${art.publisher}</strong> (${art.authors})</span>
      <a class="ext-link" href="${art.url}" target="_blank" rel="noopener">🔗 開啟原始文本</a>
    </div>
    <h2 class="title-zh">${art.titleZh}</h2>
    <div class="title-orig">📖 原文文獻名稱：${art.titleOrig}</div>
    <div style="margin-bottom:8px;">${art.tags.map(t => `<span class="tag-pill">${t}</span>`).join(" ")}</div>

    <div class="action-bar">
      <strong style="font-size:0.82rem;color:#1e293b;">📌 主文獻直接入庫操作：</strong>
      ${buildSaveButtonsHtml(art, true)}
    </div>

    <div class="sub-tabs">
      <button class="sub-btn ${curSubTab === 0 ? 'active' : ''}" onclick="curSubTab=0;renderAll();">📌 1. 事實摘要 ＆ 📜 原文引句</button>
      <button class="sub-btn ${curSubTab === 1 ? 'active' : ''}" onclick="curSubTab=1;renderAll();">⚖️ 2. 批判性觀點與反思</button>
      <button class="sub-btn ${curSubTab === 2 ? 'active' : ''}" onclick="curSubTab=2;renderAll();">💼 3. 顧問洞察 ＆ 🎓 備課提問</button>
      <button class="sub-btn ${curSubTab === 3 ? 'active' : ''}" onclick="curSubTab=3;renderAll();">📚 4. 深入展開 ＆ 3 篇延伸文獻 (含直接入庫按鈕)</button>
    </div>
    <div>${bodyHtml}</div>
  `;
}

// Read saved state if available
fetch("http://127.0.0.1:8765/api/status").then(r => r.json()).then(d => {
  if (d && d.saved) Object.assign(savedState, d.saved);
  renderAll();
}).catch(() => renderAll());

renderAll();
</script>
</body>
</html>
